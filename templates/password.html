{% extends 'base.html' %}

{% block content %}
<div class="card">
    <h2>🔐 Password Strength & Entropy Analyzer</h2>
    <p>Test password complexity, calculate mathematical entropy, and evaluate brute-force vulnerability.</p>
    
    <div class="form-group">
        <input type="password" id="passwordInput" placeholder="Enter password to test" class="input-field">
        <button onclick="checkPassword()" class="btn">Test Strength</button>
    </div>

    <div id="pwdResultBox" class="result-box hidden">
        <h3 id="pwdStatus"></h3>
        <p><strong>Entropy:</strong> <span id="pwdEntropy"></span> bits</p>
        <p><strong>Length:</strong> <span id="pwdLength"></span> characters</p>
    </div>
</div>

<script>
async function checkPassword() {
    const pwd = document.getElementById('passwordInput').value;
    if (!pwd) return;

    const response = await fetch('/api/check-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pwd })
    });

    const data = await response.json();

    document.getElementById('pwdResultBox').classList.remove('hidden');
    document.getElementById('pwdStatus').innerText = `Strength Rating: ${data.status}`;
    document.getElementById('pwdEntropy').innerText = data.entropy;
    document.getElementById('pwdLength').innerText = data.length;
}
</script>
{% endblock %}
